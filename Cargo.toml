[package]
name = "pogsag-koder"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", default-features = false }
hound = "3.5.1"
rfd = "0.17.2"
serialport = { version = "4.10", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis"] }

[[bin]]
name = "koder_dekoder_pogsag"
path = "src/main.rs"

[profile.release]
strip = true
